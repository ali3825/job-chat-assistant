services:
  - type: web
    name: jobpilot
    runtime: docker
    healthCheckPath: /health
    disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    envVars:
      - { key: DATABASE_URL, value: "sqlite:////var/data/app.db" }
      - { key: LLM_PROVIDER, value: none }
      - { key: LLM_API_KEY, sync: false }
      - { key: LLM_MODEL, sync: false }
